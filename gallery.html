<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>גלריית תמונות — דורון מרגיטאי ז"ל</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;700&family=Heebo:wght@300;400;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Heebo', sans-serif; background: #0a0a0a; color: #e8e0d0; }
.page-header { background: linear-gradient(to bottom, #1a1510, #0a0a0a); padding: 70px 40px 50px; text-align: center; border-bottom: 1px solid rgba(201,169,110,0.15); }
.back-link { display: inline-flex; align-items: center; gap: 8px; color: #c9a96e; text-decoration: none; font-size: 14px; letter-spacing: 1px; margin-bottom: 30px; opacity: 0.7; transition: opacity 0.2s; }
.back-link:hover { opacity: 1; }
.page-label { font-size: 11px; letter-spacing: 4px; color: #c9a96e; text-transform: uppercase; margin-bottom: 12px; }
.page-title { font-family: 'Frank Ruhl Libre', serif; font-size: clamp(32px, 6vw, 52px); font-weight: 700; color: #e8e0d0; margin-bottom: 10px; }
.page-sub { font-size: 15px; color: #777; }
.divider { width: 100px; height: 1px; background: linear-gradient(to left, transparent, #c9a96e, transparent); margin: 24px auto 0; }
.filters { display: flex; justify-content: center; gap: 12px; padding: 30px 20px 10px; flex-wrap: wrap; }
.filter-btn { background: transparent; border: 1px solid rgba(201,169,110,0.3); color: #888; padding: 8px 20px; border-radius: 20px; font-family: 'Heebo', sans-serif; font-size: 14px; cursor: pointer; transition: all 0.3s; }
.filter-btn.active, .filter-btn:hover { border-color: #c9a96e; color: #c9a96e; background: rgba(201,169,110,0.08); }
.gallery { columns: 3; column-gap: 12px; max-width: 1200px; margin: 0 auto; padding: 30px 20px 60px; }
@media (max-width: 900px) { .gallery { columns: 2; } }
@media (max-width: 500px) { .gallery { columns: 1; } }
.gallery-item { break-inside: avoid; margin-bottom: 12px; position: relative; overflow: hidden; border-radius: 4px; cursor: pointer; opacity: 0; transform: translateY(16px); animation: fadeUp 0.5s forwards; }
@keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
.gallery-item img { width: 100%; display: block; transition: transform 0.4s, filter 0.4s; filter: brightness(0.9); }
.gallery-item:hover img { transform: scale(1.03); filter: brightness(1); }
.era-badge { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: #c9a96e; font-size: 11px; letter-spacing: 1px; padding: 4px 10px; border-radius: 20px; }
.lightbox { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; flex-direction: column; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 90vw; max-height: 85vh; object-fit: contain; border-radius: 4px; }
.lightbox-close { position: absolute; top: 20px; left: 20px; color: #c9a96e; font-size: 32px; cursor: pointer; background: none; border: none; line-height: 1; }
.lightbox-nav { display: flex; gap: 20px; margin-top: 20px; }
.lightbox-nav button { background: rgba(201,169,110,0.15); border: 1px solid rgba(201,169,110,0.3); color: #c9a96e; padding: 10px 24px; border-radius: 2px; cursor: pointer; font-family: 'Heebo', sans-serif; font-size: 16px; transition: all 0.2s; }
.lightbox-nav button:hover { background: rgba(201,169,110,0.25); }
footer { text-align: center; padding: 40px; border-top: 1px solid rgba(201,169,110,0.1); color: #555; font-size: 13px; line-height: 1.8; }
</style>
</head>
<body>
<div class="page-header">
  <a href="index.html" class="back-link">← חזרה לדף הראשי</a>
  <div class="page-label">גלריית תמונות</div>
  <div class="page-title">דורון בתמונות</div>
  <div class="page-sub">מהנוער ועד לפרמדיק הבכיר — חיים שלמים של אדם מיוחד</div>
  <div class="divider"></div>
</div>
<div class="filters">
  <button class="filter-btn active" onclick="filterGallery('all', this)">הכל</button>
  <button class="filter-btn" onclick="filterGallery('youth', this)">נוער וצבא</button>
  <button class="filter-btn" onclick="filterGallery('mda', this)">מד"א</button>
</div>
<div class="gallery" id="gallery"></div>
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightboxImg" src="" alt="" />
  <div class="lightbox-nav">
    <button onclick="navigateLightbox(-1)">→ הקודם</button>
    <button onclick="navigateLightbox(1)">הבא ←</button>
  </div>
</div>
<footer>לזכרו של דורון מרגיטאי ז"ל<br>פרמדיק מספר 151 • מדריך ראשי • מגן דוד אדום<br>1961 — 2025</footer>
<script>
const photos = [
  { src: 'images/gallery_01.jpg', era: 'mda', label: 'מד"א' },
  { src: 'images/gallery_02.jpg', era: 'youth', label: 'נוער' },
  { src: 'images/gallery_03.jpg', era: 'mda', label: 'מד"א' },
  { src: 'images/gallery_04.jpg', era: 'mda', label: 'מד"א' },
  { src: 'images/gallery_05.jpg', era: 'youth', label: 'טיול' },
  { src: 'images/gallery_06.jpg', era: 'youth', label: 'דרום' },
  { src: 'images/gallery_07.jpg', era: 'youth', label: 'טיול' },
  { src: 'images/gallery_08.jpg', era: 'youth', label: 'נוער' },
  { src: 'images/gallery_09.jpg', era: 'youth', label: 'נוער' },
  { src: 'images/gallery_10.jpg', era: 'youth', label: 'נוער' },
  { src: 'images/gallery_11.jpg', era: 'youth', label: 'נוער' },
  { src: 'images/gallery_12.jpg', era: 'youth', label: 'נוער' },
  { src: 'images/gallery_13.jpg', era: 'mda', label: 'מד"א' },
  { src: 'images/gallery_14.jpg', era: 'mda', label: 'מד"א' },
  { src: 'images/doron_smoking.jpg', era: 'mda', label: 'מד"א' },
  { src: 'images/gallery_15.jpg', era: 'mda', label: 'מד"א' },
  { src: 'images/gallery_16.jpg', era: 'mda', label: 'מד"א' },
  { src: 'images/gallery_17.jpg', era: 'mda', label: 'מד"א' },
  { src: 'images/gallery_18.jpg', era: 'mda', label: 'מד"א' },
  { src: 'images/gallery_19.jpg', era: 'mda', label: 'מד"א' },
  { src: 'images/gallery_20.jpg', era: 'mda', label: 'מד"א' },
  { src: 'images/gallery_21.jpg', era: 'mda', label: 'מד"א' },
  { src: 'images/gallery_22.jpg', era: 'mda', label: 'צבא' },
  { src: 'images/gallery_23.jpg', era: 'mda', label: 'מד"א' },
  { src: 'images/gallery_24.jpg', era: 'mda', label: 'מד"א' },
  { src: 'images/gallery_25.jpg', era: 'mda', label: 'מד"א' },
  { src: 'images/gallery_26.jpg', era: 'mda', label: 'מד"א' },
  { src: 'images/gallery_27.jpg', era: 'mda', label: 'מד"א' },
  { src: 'images/gallery_28.jpg', era: 'mda', label: 'מד"א' },
  { src: 'images/gallery_29.jpg', era: 'mda', label: 'מד"א' },
  { src: 'images/gallery_30.jpg', era: 'mda', label: 'מד"א' },
  { src: 'images/gallery_31.jpg', era: 'mda', label: 'מד"א' },
];

let currentFilter = 'all';
let currentIndex = 0;
let filteredPhotos = [...photos];

function renderGallery(filter) {
  currentFilter = filter;
  filteredPhotos = filter === 'all' ? photos : photos.filter(p => p.era === filter);
  const gallery = document.getElementById('gallery');
  gallery.innerHTML = '';
  filteredPhotos.forEach((photo, i) => {
    const item = document.createElement('div');
    item.className = 'gallery-item';
    item.style.animationDelay = `${i * 0.05}s`;
    item.innerHTML = '<img src="' + photo.src + '" alt="דורון מרגיטאי" loading="lazy" /><span class="era-badge">' + photo.label + '</span>';
    item.onclick = () => openLightbox(i);
    gallery.appendChild(item);
  });
}

function filterGallery(filter, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGallery(filter);
}

function openLightbox(index) {
  currentIndex = index;
  document.getElementById('lightboxImg').src = filteredPhotos[index].src;
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

function navigateLightbox(dir) {
  currentIndex = (currentIndex + dir + filteredPhotos.length) % filteredPhotos.length;
  document.getElementById('lightboxImg').src = filteredPhotos[currentIndex].src;
}

document.getElementById('lightbox').addEventListener('click', function(e) {
  if (e.target === this) closeLightbox();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') navigateLightbox(1);
  if (e.key === 'ArrowRight') navigateLightbox(-1);
});

renderGallery('all');
</script>
</body>
</html>
