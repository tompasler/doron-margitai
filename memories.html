<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Frank+Ruhl+Libre:wght@300;400;700&family=Heebo:wght@300;400;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Heebo', sans-serif; background: #0a0a0a; color: #e8e0d0; overflow-x: hidden; }
.page-header { background: linear-gradient(to bottom, #1a1510, #0a0a0a); padding: 70px 40px 50px; text-align: center; border-bottom: 1px solid rgba(201,169,110,0.15); }
.back-link { display: inline-flex; align-items: center; gap: 8px; color: #c9a96e; text-decoration: none; font-size: 14px; letter-spacing: 1px; margin-bottom: 30px; opacity: 0.7; transition: opacity 0.2s; }
.back-link:hover { opacity: 1; }
.page-label { font-size: 11px; letter-spacing: 4px; color: #c9a96e; text-transform: uppercase; margin-bottom: 12px; }
.page-title { font-family: 'Frank Ruhl Libre', serif; font-size: clamp(32px, 6vw, 56px); font-weight: 700; color: #e8e0d0; margin-bottom: 10px; }
.page-sub { font-size: 15px; color: #777; }
.divider { width: 100px; height: 1px; background: linear-gradient(to left, transparent, #c9a96e, transparent); margin: 24px auto 0; }
.filters { display: flex; justify-content: center; gap: 12px; padding: 30px 20px 0; flex-wrap: wrap; }
.filter-btn { background: transparent; border: 1px solid rgba(201,169,110,0.3); color: #888; padding: 8px 20px; border-radius: 20px; font-family: 'Heebo', sans-serif; font-size: 14px; cursor: pointer; transition: all 0.3s; }
.filter-btn.active, .filter-btn:hover { border-color: #c9a96e; color: #c9a96e; background: rgba(201,169,110,0.08); }
.memories-grid { max-width: 1100px; margin: 0 auto; padding: 50px 30px 60px; columns: 2; column-gap: 24px; }
@media (max-width: 700px) { .memories-grid { columns: 1; padding: 30px 16px; } }
.memory-card { break-inside: avoid; background: rgba(255,255,255,0.03); border: 1px solid rgba(201,169,110,0.12); border-radius: 4px; padding: 28px 28px 24px; margin-bottom: 24px; opacity: 0; transform: translateY(20px); animation: fadeUp 0.5s forwards; }
.memory-card:hover { border-color: rgba(201,169,110,0.3); background: rgba(201,169,110,0.04); }
.quote-card { break-inside: avoid; background: rgba(201,169,110,0.07); border: 1px solid rgba(201,169,110,0.25); border-right: 3px solid #c9a96e; border-radius: 4px; padding: 24px 28px 20px; margin-bottom: 24px; opacity: 0; transform: translateY(20px); animation: fadeUp 0.5s forwards; }
.quote-card:hover { background: rgba(201,169,110,0.11); }
.quote-mark { font-family: 'Playfair Display', serif; font-size: 48px; color: rgba(201,169,110,0.4); line-height: 0.6; margin-bottom: 12px; display: block; }
.quote-text { font-family: 'Frank Ruhl Libre', serif; font-size: 17px; line-height: 1.75; color: #d8ceb8; white-space: pre-line; }
.quote-label { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(201,169,110,0.15); font-size: 11px; letter-spacing: 2px; color: #c9a96e; text-transform: uppercase; }
@keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
.memory-text { font-size: 15px; line-height: 1.85; color: #c8c0b0; white-space: pre-line; margin-bottom: 18px; }
.memory-footer { display: flex; align-items: center; gap: 10px; border-top: 1px solid rgba(201,169,110,0.1); padding-top: 14px; }
.memory-avatar { width: 32px; height: 32px; border-radius: 50%; background: rgba(201,169,110,0.15); border: 1px solid rgba(201,169,110,0.3); display: flex; align-items: center; justify-content: center; font-size: 14px; color: #c9a96e; flex-shrink: 0; }
.memory-name { font-size: 13px; color: #c9a96e; font-weight: 600; letter-spacing: 0.5px; }
footer { text-align: center; padding: 40px; border-top: 1px solid rgba(201,169,110,0.1); color: #555; font-size: 13px; }
</style>

<script>
const memories = [
  { type: 'memory', name: "מירית חלפון", text: 'אטן חולון. סוף משמרת, דורון: "יש לכם 4 דקות לטפל" כל התרופות עפות באוויר בזמן ניהול MI על סף החייאה. סיימנו ואז דורון "אני מרגיש כמו זונה שעבדה כל הלילה".' },
  { type: 'memory', name: "שחר לרר", text: 'דורון יושב בפאנל ושותק בצורה מאוד לא אופיינית.\nפניתי אחרי לשאול למה — הוא מסתכל עלי ואומר: "תשקיע בטירונות, כי אתה לא הולך להיות פראמדיק, אלא פראמדיק צבאי. מה שיציל לך את החיים יהיה כמה מהר אתה מתפעל את הנשק שלך."\n\n20 שנים אחרי, עדיין חושב על דורון כל פעם שאני חותם על נשק.\nאדם דגול, ענק בין גמדים. יהי זכרו ברוך.' },
  { type: 'memory', name: "רון טולדנו", text: 'דורון הסתכל עלינו במבט המופתע-חצי-בצחוק שלו ואמר:\n"חברה, תקשיבו לי — האנשים המוצלחים באמת בחיים הם אלו שיודעים גם לחפף."\n\nאני בן 35 והמשפט הזה מלווה אותי עד היום, 15 שנה אחרי. תנצבה.' },
  { type: 'memory', name: "קים אזולאי", text: 'דורון היה הסיבה העיקרית שבחרתי להשתלם במדא חולון. ממש הערכתי והערצתי אותו — פראמדיק, מורה ומדריך, השנינות, ההומור, החדות.\n\nזו באמת זכות גדולה להיות עוד אחת מהאנשים שהוא השפיע עליהם לדורות. יהי זכרו ברוך.' },
  { type: 'memory', name: "ארבל בן זקן", text: 'את דורון הכרתי בתור חניך בקורס פרמדיקים צבאי — תמיד חיכיתי לשיעורים איתו שהיו מלאי עניין. תמיד ידע לומר את הדברים כמו שהם בלי ליפות אותם.\n\nלא היה פרמדיק שלא הכיר אותו וזכר את הידע הפנומנלי שלו וחוש ההומור הבוטה והמשובח. תמיד אזכור אותו לטובה.' },
  { type: 'memory', name: "גיל ומושר", text: 'לפני תקופת הפרוטוקולים היתה תקופה שאנשים בנו את מקצוע הפראמדיק במו ידיהם. הם כתבו את התורה.\n\nאחד האנשים הללו הלך מאיתנו — דורון מרגיטאי. דורון היה מנטור, מורה דרך, וחבר.\n\nבאנו מתחנת לוד, לא ידענו כלום. הוא צחק ואמר — מצוין שאתם לא יודעים, נלמד אתכם הכל, כמו שצריך.\n\nבליבי יש לו מקום תמיד.' },
  { type: 'memory', name: "ענבר עדני", text: 'דורון היה פרמדיק בחסד עליון. עד היום אני נותנת גלוקוז כמוהו.\n\nהוא ידע מנגנונים של תרופות בצורה פנומנלית. היה קורא את שם המטופל בויזה ויודע בדיוק מה המחלות שיש לו ברקע — וכשהגענו לחולה הכל היה בדיוק כמו שתיאר.\n\nאני מודה על כך שהייתה לי הזכות ללמוד ממנו.' },
  { type: 'memory', name: "בר בוהדנה", text: 'לדורון היה LG G3. במהלך המשמרת הטלפון התחמם לו בכיס ואז הגיע הסיפור על איך הטלפון "הרים לו את הג\'ק" בלי סיאליס...' },
  { type: 'memory', name: "רוני שיסגל", text: 'אני זוכרת את המפגש הראשון עם דורון בקורס פרמדיקים ב-2013. אחד המשפטים הראשונים שלו היה:\n"גינקולוג גבר הוא כמו מוסכניק שאף פעם לא היה לו רכב."\n\nמשפט אגדי שאני מספרת כבר שנים. אחד ויחיד במינו. הוא כבר חסר.' },
  { type: 'memory', name: "דביר מקלר", text: 'לדורון היה תחביב — משחק ניחושים. כשהיתה מתקבלת קריאה הוא ניסה לספר את סיפור המקרה עוד בדרך.\n\nבאחת הקריאות אמר לי: "קוראים למטופלת צילה והיא גרה בשכונה ותיקה של חולון. אני מנחש שהיא מורה." כשהגענו — אכן מורה מהדור הראשון של תושבי חולון.\n\nדורון התחיל להסתובב בבית כמו בלש. אחרי כמה דקות אמר: "נראה לי שהגברת פשוט בודדה." ומהשלב הזה — התיישב ודיבר איתה.\n\nכזה היה דורון. חכם, בלש רפואי, ורגיש למי שעומד מולו. — דביר.' },
  { type: 'memory', name: "יערה לבון", text: 'דורון היה איש מקסים ואדיב ודוגמה כאדם וכפרמדיק.\n\nבמשמרת הראשונה אמר לי שהאטומידט יהרוג לי מטופלים — הוא היה היחיד שאמר את זה. הוא צדק לגמרי.\n\nפעם שמטופל פסיכוטי העביר לי יד — לפני שהבנתי מה קורה דורון כבר ישב עליו. ככה גיליתי שידע איקידו.\n\nהוא יישאר איתי בלב לתמיד.' },
  { type: 'memory', name: "גבריאל מומקו", text: 'הייתי נהג די חדש במדא. הגענו למקרה שהתדרדר להחייאה, הזמנו אטן ולמזלנו הגיע דורון.\n\nבמהלך ההחייאה הוא שמר על שקט נפשי, ידע בדיוק מה לעשות, ועשה הכל בצורה ענווה ושקטה תוך כדי הוראה לכולם. המטופל ניצל.\n\nאת המקרה הזה אני לא אשכח לעולם. נתגעגע אליו תמיד!' },
  { type: 'memory', name: "עדי אוחיון", text: 'בעלי אורי דיבר המון על דורון וממש העריץ אותו. יום אחד נתקלתי בדורון ואמרתי לו שבעלי אומר שהוא האדם הכי חכם שהוא פגש בחייו.\n\nהוא היה די בשוק — אבל ראיתי איך סומק מתפשט בלחייו ונוצות הטווס לאט נפתחות.\n\nשמחתי שיכולתי להעניק לאיש המיוחד הזה כמה רגעים של נחת. לא נשכח אותו לעולם. — עדי ואורי אוחיון.' },
  { type: 'memory', name: "שלמה סמבול", text: 'זכיתי לעבוד עם דורון כנהג נטן כאשר היה פרמדיק אחראי בסניף לוד-רמלה בתחילת שנות התשעים. גם הוא היה כמוני רנטגנאי. איש יקר היה. יהי זכרו ברוך!' },
  { type: 'memory', name: "תום פסלר", text: 'כשנפתח האטן בחולון בשנת 1998 הייתי בן 18. שמו של דורון נאמר ביראת כבוד.\n\nהוא הגיע. ומיד הבנתי שזה משהו אחר. הסתכל לנו תמיד בגובה העיניים ולימד. גם במקרים הכי קשים תמיד הסביר וענה על שאלות.\n\nהוא לא היה הפרמדיק הכי טוב, המדריך הכי טוב, העובד הכי טוב — היה התגלמות של כולם באדם אחד.\n\nבהערכה והערצה אמיתיות. — תום' },
  { type: 'memory', name: "בכרך", text: 'עבדתי עם דורון הרבה שנים בלוד, אחר כך בחולון.\n\nיום אחד הגעתי ב-15:05. דורון, בדרכו המיוחדת, אמר לי:\n"בכרך, אני בסך הכל מחבב אותך — אבל כבר חמש עשרה דקות אני שונא אותך ממש"' },
  { type: 'memory', name: "רונן כהן", text: 'דורקה — מי היה מאמין שאכתוב עליך בלשון עבר.\n\nדורון היה אחד מהמדריכים שלי בקורס פראמדיקים מספר 16. לא ספר מהלך — אנציקלופדיה מהלכת.\n\nאחרי פיגוע במועדון השפילד ב-2002 — שנינו הגענו מהבית. ודורון רץ כל הדרך מחולון לראשלץ.\n\nהתברר שפצוע שטיפלנו בו חיפש אותנו 13 שנה להודות לנו. רק ב-2015 נוצר החיבור.\n\nנוח על משכבך בשלום, חבר יקר.' },
  { type: 'memory', name: "אריאל קורן", text: 'כל כך הרבה אנשים חייבים את חייהם לאיש הזה. איש אציל נפש שלא רק הציל רבבות — הוא גם עיצב את אופיים המקצועי של דורות של פרמדיקים.\n\nדורון היה אינטליגנט ומבריק, סבלני, בעל חוש הומור יוצא דופן — ועם זאת, צנוע מאד ואנושי מאד.\n\nגאה להיות בין חניכיו הרבים. אבדה עצומה לכולנו. תנצבה.' },
  { type: 'memory', name: "שלמי ארז", text: 'אגדה.\n\nאדם עם לב ענק — אנושי, מחונן ובעל חוש הומור מיוחד וחד. הציל המון אנשים ותרם רבות למאות אנשים.\n\nיהי זכרו ברוך. עצוב מאד.' },
  { type: 'memory', name: "תומר ברדה", text: 'היה איש משכמו ומעלה. עם כמה שהיה אדם שנתנו לו הרבה כבוד — נשאר צנוע. למדתי ממנו הרבה. זכות גדולה הייתה להכיר אותו.' },
  { type: 'memory', name: "סימה הילר", text: 'דורון מרגיטאי האחד והיחיד. לא היה ולא יהיה פראמדיק כמותו.\n\nהייתה לי הזכות להכיר אותו, ללמוד ממנו ולסייע לו בהחייאות רבות ואף בהדרכת קורס פרמדיק מספר 20.\n\nעשינו שמיניות רק כדי לעשות איתו עוד משמרת. חולון איבדה את הפרמדיק מספר 1. יהי זכרו ברוך!' },
  { type: 'memory', name: "איתמר אהרונסון", text: 'היה איש.\nהיה אנושי.\nאהבתי אותו.' },
  { type: 'memory', name: 'דר ערן טל-אור', text: 'שמעתי בהלם על מותו הפתאומי של דורון. הכרתי אותו מהמוקד הרפואי — תמיד היה רגוע, ענייני ורהוט. אחד האנשים שהביא בכל יום כבוד למקצוע הפרמדיק.\n\nאבדה כבדה למשפחתו ולנו. תנחומי למשפחה — משמים תנחמו.' },
{ type: 'memory', name: "שמי קלבו", text: 'אני לא נוהג להעלות פוסטים, אבל הפעם, בעקבות פטירתו של חברי דורון מרגיטאי, הרגשתי צורך.\n\nאת דורון פגשתי ב-85, כששנינו הגענו ליום הראשון של לימודי הרנטגן, ותוך חמש דקות הבנו שאנחנו נהיה שותפים לחדר — וכך היה.\n\nבמשך שנתיים היינו צמודים אחד לשני — בחדר, בלימודים, בטיולים רגליים, ברכיבה על האופנוע שלי (כולל התהפכות משותפת אחרי טיפול ששני "המכונאים הדגולים" עשו), ובבילויים.\n\nדורון היה בן בית אצלנו. היה מגיע ושואל: "נו, אמא של שמי, מאיזה מטעמי ידייך אזכה לאכול היום?"\n\nזכיתי להכיר אדם בעל זיכרון פנומנלי, שאוהב לקרוא וללמוד כל דבר שרק אפשר. היו לנו אינספור שעות של צחוק וציניות לתוך הלילות הארוכים, ומעולם לא היה משעמם.\n\nכבר בתחילת הלימודים שכנעתי את דורון לבוא לעבוד איתי במדא — בהתחלה כנהג שרל, ואחר כך עשה קורס נהגים. ובחופשת סוף הלימודים הבנו שנינו שאנחנו הולכים לקורס פראמדיקים. וגם בקורס הזה, כמובן, סיים ראשון ובהצטיינות.\n\nדורון מאוד "אהב" שמתקהלים סביב האמבולנס ושואלים "מה קרה?" — ותמיד היו לו תשובות שגורמות לאנשים לעזוב את המקום מהר.\n\nעם השנים הקשר התרופף, ולמרות זאת, מדי פעם כשהיינו נפגשים — זה היה כאילו הקשר מעולם לא נותק. ואני מצר על כך שבשנים האחרונות לא התאמצתי יותר כדי להיות בקשר.\n\nדורון, השארת בן שימשיך את דרכך בכבוד, ומורשת שתישאר לעד. בהחלט הגיע לך פרס מפעל החיים שקיבלת.\n\nהייה שלום, חבר. ואם יש שם משהו למעלה — בטוח תמצא איזו ספרייה להתנחל בה.' },

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const quoteCards = quotes.map(q => ({ type: 'quote', text: q }));
const allCards = shuffle([...memories, ...quoteCards]);

function renderCards(typeFilter) {
  const grid = document.getElementById('memoriesGrid');
  grid.innerHTML = '';
  const filtered = typeFilter === 'all' ? allCards : allCards.filter(c => c.type === typeFilter);
  filtered.forEach((card, i) => {
    const el = document.createElement('div');
    el.style.animationDelay = `${i * 0.04}s`;
    if (card.type === 'quote') {
      el.className = 'quote-card';
      el.innerHTML = '<span class="quote-mark">"</span><div class="quote-text">' + card.text + '</div><div class="quote-label">✦ אמרה של דורון</div>';
    } else {
      el.className = 'memory-card';
      el.innerHTML = '<div class="memory-text">' + card.text + '</div><div class="memory-footer"><div class="memory-avatar">' + card.name.trim()[0] + '</div><div class="memory-name">' + card.name + '</div></div>';
    }
    grid.appendChild(el);
  });
}

function filter(type, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCards(type);
}

renderCards('all');
